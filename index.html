<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOUHAIL ALAOUI | ACCESS</title>
<style>
:root{
  --bg:#050505; --red:#ff2a2a; --yellow:#ffc933; --ok:#3dff8a;
  --text:#f1ecec; --dim:#8a8484; --accent:var(--red);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
body.unlocked{--accent:var(--ok);}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.18em;}

/* ---------- background fx ---------- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0;}
.glow{
  background:
    radial-gradient(ellipse 50% 40% at 50% 45%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
    radial-gradient(ellipse 30% 25% at 85% 100%,rgba(255,201,51,.12),transparent 70%);
  animation:pulse 5s ease-in-out infinite;
}
.scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);opacity:.6;}
.vignette{background:radial-gradient(ellipse at center,transparent 45%,#000 100%);z-index:1;}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:opacity .6s,visibility .6s;}
#loader.done{opacity:0;visibility:hidden;}
.ring{width:64px;height:64px;border-radius:50%;border:3px solid #222;border-top-color:var(--yellow);
  border-right-color:var(--red);animation:spin 1s linear infinite;}
#loader p{font-size:12px;color:var(--dim);}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;inset-inline:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0)) 18px 14px;}
.status{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--accent);
  padding:8px 14px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:100px;
  background:rgba(0,0,0,.5);transition:color .4s,border-color .4s;}
.led{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.4s infinite;}
body.unlocked .led{animation:none;}
@keyframes blink{50%{opacity:.25}}

.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid #333;background:rgba(255,255,255,.04);
  color:var(--text);font-size:18px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--accent);}
/* locked: icons look disabled and show a lock instead */
body.locked .icon-btn{color:#5a5252;border-style:dashed;background:rgba(255,42,42,.06);}
body.locked .icon-btn .ico{font-size:0;}
body.locked .icon-btn .ico::before{content:'🔒';font-size:16px;filter:grayscale(1);}
body.unlocked #exitBtn{border-color:var(--ok);color:var(--ok);box-shadow:0 0 14px rgba(61,255,138,.35);}

/* ---------- stage ---------- */
.stage{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:90px 22px 40px;gap:20px;}
.name{font-size:clamp(34px,9vw,92px);font-weight:900;letter-spacing:.06em;line-height:1.1;position:relative;
  direction:ltr;text-shadow:0 0 28px color-mix(in srgb,var(--accent) 55%,transparent);
  animation:flicker 6s infinite,rise 1.2s ease both;}
.name::before,.name::after{content:attr(data-text);position:absolute;inset:0;opacity:.6;mix-blend-mode:screen;}
.name::before{color:var(--yellow);animation:glitch1 4s infinite steps(1);}
.name::after{color:var(--red);animation:glitch2 4s infinite steps(1);}
body.unlocked .name::before,body.unlocked .name::after{display:none;}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97);filter:blur(8px)}}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.75}}
@keyframes glitch1{0%,90%,100%{transform:none;clip-path:inset(0 0 0 0)}92%{transform:translate(-4px,0);clip-path:inset(20% 0 55% 0)}95%{transform:translate(3px,0);clip-path:inset(60% 0 10% 0)}}
@keyframes glitch2{0%,90%,100%{transform:none;clip-path:inset(0 0 0 0)}93%{transform:translate(4px,0);clip-path:inset(45% 0 30% 0)}96%{transform:translate(-3px,0);clip-path:inset(5% 0 75% 0)}}

.tag{font-size:clamp(10px,2.6vw,13px);color:var(--dim);}

.box{display:flex;gap:10px;width:min(440px,100%);margin-top:14px;padding:8px;border-radius:16px;
  background:rgba(10,10,10,.75);border:1px solid #2b2b2b;backdrop-filter:blur(10px);
  transition:border-color .3s,box-shadow .3s;}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 30%,transparent);}
.box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);
  padding:14px 14px;font-size:16px;letter-spacing:.2em;font-family:ui-monospace,Consolas,monospace;}
.box input::placeholder{color:#544e4e;letter-spacing:.2em;font-size:12px;}
.enter{border:none;border-radius:11px;padding:0 24px;font-weight:800;font-size:15px;cursor:pointer;
  background:linear-gradient(135deg,var(--yellow),var(--red));color:#180404;transition:transform .15s,filter .2s;}
.enter:hover{filter:brightness(1.1);}
.enter:active{transform:scale(.96);}
body.unlocked .enter{background:linear-gradient(135deg,#8dffbd,var(--ok));}
.box.shake{animation:shake .5s;border-color:var(--red);}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}

.msg{min-height:24px;font-size:14px;font-weight:700;color:var(--red);}
.msg.ok{color:var(--ok);}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0));z-index:60;
  transform:translate(-50%,30px);opacity:0;pointer-events:none;max-width:90vw;
  background:#180606;border:1px solid var(--red);color:#ffdada;padding:14px 22px;border-radius:12px;
  font-size:14px;font-weight:700;box-shadow:0 0 30px rgba(255,42,42,.35);transition:all .35s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.good{background:#06180d;border-color:var(--ok);color:#d6ffe6;box-shadow:0 0 30px rgba(61,255,138,.3);}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;}}
@media (max-width:520px){.enter{padding:0 18px;}.status{font-size:10px;padding:7px 11px;}}

/* ---------- mobile exit-gesture hardening (in-page only) ---------- */
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
input{-webkit-user-select:text;user-select:text;}

</style>
</head>
<body class="locked">

<div id="loader"><div class="ring"></div><p class="mono">INITIALIZING<span class="dots"></span></p></div>

<div class="fx glow"></div>
<div class="fx scan"></div>
<div class="fx vignette"></div>

<header class="topbar">
  <button class="icon-btn" id="backBtn" aria-label="رجوع"><span class="ico">←</span></button>
  <div class="status mono" id="status"><i class="led"></i><span id="statusTxt">ACCESS LOCKED</span></div>
  <button class="icon-btn" id="exitBtn" aria-label="خروج"><span class="ico">✕</span></button>
</header>

<main class="stage">
  <h1 class="name" data-text="SOUHAIL ALAOUI">SOUHAIL ALAOUI</h1>
  <p class="tag mono" id="tag">RESTRICTED AREA — AUTHORIZATION REQUIRED</p>

  <form class="box" id="form" autocomplete="off" novalidate>
    <input id="pw" type="password" placeholder="ENTER PASSWORD" dir="ltr" autocomplete="off" spellcheck="false">
    <button type="submit" id="enterBtn" class="enter">دخول</button>
  </form>

  <p class="msg" id="msg" role="alert"></p>
</main>

<div class="toast" id="toast" role="alert"></div>

<script>
(() => {
  'use strict';

  // NOTE: this is a UI-level lock only. Anyone can read this file,
  // so it is not real security and never blocks closing the tab/app.
  const SECRET = 'ana himar';

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const form = $('form'), pw = $('pw'), box = form;
  const msg = $('msg'), toast = $('toast'), tag = $('tag');
  const statusTxt = $('statusTxt');
  const backBtn = $('backBtn'), exitBtn = $('exitBtn');

  let unlocked = false;
  let toastTimer;

  /* ---------- loader ---------- */
  window.addEventListener('load', () => {
    setTimeout(() => {
      $('loader').classList.add('done');
      pw.focus({ preventScroll: true });
    }, 1600);
  });

  /* ---------- helpers ---------- */
  function showToast(text, good = false) {
    toast.textContent = text;
    toast.classList.toggle('good', good);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function shake() {
    box.classList.remove('shake');
    void box.offsetWidth; // restart animation
    box.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate(120);
  }

  function setMsg(text, ok = false) {
    msg.textContent = text;
    msg.classList.toggle('ok', ok);
  }

  /* ---------- unlock ---------- */
  function unlock() {
    unlocked = true;
    releaseGuard();
    body.classList.replace('locked', 'unlocked');
    statusTxt.textContent = 'ACCESS GRANTED';
    tag.textContent = 'WELCOME — AUTHORIZATION CONFIRMED';
    setMsg('تم التحقق بنجاح ✔ — تم تفعيل زر الخروج', true);
    showToast('ACCESS GRANTED', true);
    pw.value = '';
    pw.disabled = true;
    $('enterBtn').textContent = 'تم';
    $('enterBtn').disabled = true;
    backBtn.setAttribute('aria-label', 'رجوع');
    exitBtn.setAttribute('aria-label', 'خروج');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (unlocked) return;
    if (pw.value === SECRET) {
      unlock();
    } else {
      setMsg('الكود غير صحيح');
      shake();
      showToast('الكود غير صحيح');
      pw.select();
    }
  });

  /* ---------- back / exit icons ---------- */
  function guarded(action) {
    return () => {
      if (!unlocked) {
        setMsg('أدخل الكود أولاً للمتابعة');
        showToast('أدخل الكود أولاً 🔒');
        shake();
        pw.focus({ preventScroll: true });
        return;
      }
      action();
    };
  }

  backBtn.addEventListener('click', guarded(() => {
    if (history.length > 1) history.back();
    else showToast('لا توجد صفحة سابقة', true);
  }));

  exitBtn.addEventListener('click', guarded(() => {
    showToast('جاري الخروج…', true);
    setTimeout(() => {
      window.close(); // works only if the tab was opened by script
      // Browsers may refuse; tell the user instead of forcing anything.
      setTimeout(() => showToast('المتصفح منع الإغلاق التلقائي — أغلق التبويب يدوياً', true), 400);
    }, 500);
  }));

  /* ---------- exit-gesture guards (in-page only, released on unlock) ---------- */
  // 1) Phone back button / swipe-back gesture / browser back: re-push a guard entry.
  let guardOn = false;
  function armGuard() {
    if (guardOn) return;
    guardOn = true;
    history.replaceState({ base: true }, '');
    history.pushState({ guard: true }, '');
  }
  function releaseGuard() {
    if (!guardOn) return;
    guardOn = false;
    if (history.state && history.state.guard) history.back(); // drop our extra entry
  }
  window.addEventListener('popstate', () => {
    if (unlocked || !guardOn) return;
    history.pushState({ guard: true }, '');           // stay on the page
    setMsg('أدخل الكود أولاً للمتابعة');
    showToast('الرجوع مقفل — أدخل الكود 🔒');
    shake();
  });
  armGuard();

  // 2) Fullscreen: ask on first touch/click; if the user leaves it, warn and re-enter on next tap.
  const fsEl = document.documentElement;
  const inFS = () => document.fullscreenElement || document.webkitFullscreenElement;
  function enterFS() {
    if (unlocked || inFS()) return;
    const req = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
    if (req) { try { const r = req.call(fsEl, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); } catch (_) {} }
  }
  ['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, enterFS, { passive: true }));
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) =>
    document.addEventListener(ev, () => {
      if (!unlocked && !inFS()) { showToast('ملء الشاشة مقفل — المس الشاشة للعودة 🔒'); shake(); }
    }));

  // 3) Refresh / navigation shortcuts and long-press menu while locked.
  window.addEventListener('keydown', (e) => {
    if (unlocked) return;
    const k = e.key.toLowerCase();
    const blocked = k === 'f5' || (e.ctrlKey || e.metaKey) && (k === 'r' || k === 'l') ||
                    (e.altKey && (k === 'arrowleft' || k === 'arrowright')) ||
                    (k === 'backspace' && document.activeElement !== pw);
    if (blocked) { e.preventDefault(); showToast('مقفل — أدخل الكود أولاً 🔒'); shake(); }
  });
  window.addEventListener('contextmenu', (e) => { if (!unlocked) e.preventDefault(); });

  // Escape key follows the same rule as the close icon
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') guarded(() => exitBtn.click())();
  });
})();

</script>
</body>
</html>
